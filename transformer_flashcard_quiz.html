
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.quiz-wrap{padding:1.5rem 0;max-width:680px}
.progress-bar-bg{height:4px;background:var(--color-border-tertiary);border-radius:2px;margin-bottom:1.5rem}
.progress-bar-fill{height:4px;background:#534AB7;border-radius:2px;transition:width .4s ease}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.card-counter{font-size:13px;color:var(--color-text-secondary)}
.source-badge{font-size:11px;padding:3px 10px;border-radius:var(--border-radius-md);background:#EEEDFE;color:#3C3489;font-weight:500}
.flashcard{cursor:pointer;perspective:1000px;height:220px;margin-bottom:1.25rem;user-select:none}
.flashcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 2rem;text-align:center}
.card-face-back{transform:rotateY(180deg)}
.card-face-front .hint{font-size:12px;color:var(--color-text-secondary);margin-bottom:1rem;display:flex;align-items:center;gap:5px}
.card-face-front .question{font-size:17px;font-weight:500;color:var(--color-text-primary);line-height:1.5}
.card-face-back .answer-label{font-size:11px;font-weight:500;color:#534AB7;margin-bottom:.6rem;text-transform:uppercase;letter-spacing:.05em}
.card-face-back .answer{font-size:15px;color:var(--color-text-primary);line-height:1.6}
.btn-row{display:flex;gap:10px;margin-bottom:1.25rem}
.btn-know{flex:1;padding:10px;border-radius:var(--border-radius-md);border:0.5px solid #1D9E75;background:transparent;color:#0F6E56;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.btn-know:hover{background:#E1F5EE}
.btn-review{flex:1;padding:10px;border-radius:var(--border-radius-md);border:0.5px solid #D85A30;background:transparent;color:#993C1D;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.btn-review:hover{background:#FAECE7}
.btn-flip{width:100%;padding:10px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-primary);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;margin-bottom:1rem}
.btn-flip:hover{background:var(--color-background-secondary)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem}
.stat-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.75rem 1rem;text-align:center}
.stat-val{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.stat-label{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:.5rem}
.tag{font-size:11px;padding:3px 8px;border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-secondary)}
.complete-screen{text-align:center;padding:2rem 1rem}
.complete-screen h2{font-size:20px;font-weight:500;color:var(--color-text-primary);margin-bottom:.5rem}
.complete-screen p{font-size:14px;color:var(--color-text-secondary);margin-bottom:1.5rem}
.btn-restart{padding:10px 28px;border-radius:var(--border-radius-md);border:0.5px solid #534AB7;background:transparent;color:#3C3489;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.btn-restart:hover{background:#EEEDFE}
.flipped-hint{display:none}
.flashcard.flipped .flipped-hint{display:flex}
.flashcard:not(.flipped) .flip-prompt{display:flex}
.flip-prompt{display:none}
</style>

<h2 class="sr-only">Transformer architecture flashcard quiz based on papers: Attention Is All You Need and LLaMA</h2>

<div class="quiz-wrap" id="quiz">
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress" style="width:0%"></div></div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="s-total">20</div><div class="stat-label">total cards</div></div>
    <div class="stat-card"><div class="stat-val" id="s-know" style="color:#0F6E56">0</div><div class="stat-label">i know this</div></div>
    <div class="stat-card"><div class="stat-val" id="s-review" style="color:#993C1D">0</div><div class="stat-label">review again</div></div>
  </div>

  <div class="card-meta">
    <span class="card-counter" id="counter">Card 1 of 20</span>
    <span class="source-badge" id="source-badge">Paper 1</span>
  </div>

  <div class="flashcard" id="flashcard" onclick="flipCard()">
    <div class="flashcard-inner">
      <div class="card-face card-face-front">
        <div class="hint flip-prompt"><i class="ti ti-rotate-clockwise-2" aria-hidden="true" style="font-size:14px;margin-right:4px"></i><span style="font-size:12px;color:var(--color-text-secondary)">tap to reveal answer</span></div>
        <div class="question" id="question">Loading...</div>
        <div class="tag-row" id="tags-front"></div>
      </div>
      <div class="card-face card-face-back">
        <div class="answer-label">Answer</div>
        <div class="answer" id="answer">Loading...</div>
        <div class="hint flipped-hint" style="margin-top:.75rem"><i class="ti ti-rotate-clockwise-2" aria-hidden="true" style="font-size:14px;margin-right:4px"></i><span style="font-size:12px;color:var(--color-text-secondary)">tap to go back</span></div>
      </div>
    </div>
  </div>

  <button class="btn-flip" onclick="flipCard()"><i class="ti ti-rotate-clockwise-2" aria-hidden="true"></i> flip card</button>

  <div class="btn-row">
    <button class="btn-review" onclick="markCard(false)"><i class="ti ti-refresh" aria-hidden="true"></i> review again</button>
    <button class="btn-know" onclick="markCard(true)"><i class="ti ti-check" aria-hidden="true"></i> i know this</button>
  </div>

  <div id="complete-screen" class="complete-screen" style="display:none">
    <i class="ti ti-trophy" aria-hidden="true" style="font-size:40px;color:#534AB7;margin-bottom:1rem;display:block"></i>
    <h2>Deck complete!</h2>
    <p id="complete-msg">Great work reviewing all 20 cards.</p>
    <button class="btn-restart" onclick="restart()"><i class="ti ti-refresh" aria-hidden="true"></i> restart deck</button>
  </div>
</div>

<script>
const cards = [
  {q:"What architectural innovation did 'Attention Is All You Need' introduce, and what did it replace?",a:"The Transformer — a model based entirely on attention mechanisms, replacing recurrent and convolutional networks for sequence transduction tasks.",source:"Paper 1: Attention Is All You Need",tags:["attention","architecture"]},
  {q:"What are the two main sub-layers in each Transformer encoder layer?",a:"(1) Multi-head self-attention and (2) a position-wise fully connected feed-forward network, each followed by layer normalisation and a residual connection.",source:"Paper 1: Attention Is All You Need",tags:["encoder","architecture"]},
  {q:"Why does the Transformer need positional encodings?",a:"Because it contains no recurrence or convolution, it has no inherent sense of sequence order. Positional encodings inject information about each token's position using sine and cosine functions.",source:"Paper 1: Attention Is All You Need",tags:["positional encoding"]},
  {q:"What is scaled dot-product attention and why is the scaling factor used?",a:"Attention(Q,K,V) = softmax(QKᵀ / √dₖ)V. The √dₖ scaling prevents the dot products from growing large in magnitude when dₖ is large, keeping gradients stable.",source:"Paper 1: Attention Is All You Need",tags:["attention","math"]},
  {q:"What is multi-head attention, and what is the benefit over single-head attention?",a:"Running h parallel attention heads on linearly projected Q, K, V, then concatenating results. It lets the model jointly attend to information from different representation subspaces at different positions.",source:"Paper 1: Attention Is All You Need",tags:["multi-head","attention"]},
  {q:"How did the original Transformer perform on WMT 2014 English-to-German translation?",a:"It achieved 28.4 BLEU — outperforming all previous single models and ensembles, including those with more computation.",source:"Paper 1: Attention Is All You Need",tags:["results","NLP"]},
  {q:"What is the role of the decoder's third sub-layer in the Transformer?",a:"It performs multi-head attention over the encoder output, allowing every decoder position to attend over all positions in the input sequence — the classic encoder-decoder attention.",source:"Paper 1: Attention Is All You Need",tags:["decoder","encoder"]},
  {q:"What is the feed-forward network (FFN) used in each Transformer layer?",a:"Two linear transformations with a ReLU in between: FFN(x) = max(0, xW₁+b₁)W₂+b₂. It is applied identically to each position but with different parameters per layer.",source:"Paper 1: Attention Is All You Need",tags:["FFN","architecture"]},
  {q:"Why is the Transformer more parallelisable than RNN-based models?",a:"RNNs process tokens sequentially, so they cannot be parallelised across time steps. The Transformer computes all positions simultaneously via matrix operations, greatly reducing training time.",source:"Paper 1: Attention Is All You Need",tags:["parallelism","efficiency"]},
  {q:"What training regularisation techniques were used in the original Transformer?",a:"Residual dropout (applied after each sub-layer and to the embedding sums), label smoothing with ε=0.1, and a learning rate schedule with a warm-up phase.",source:"Paper 1: Attention Is All You Need",tags:["training","regularisation"]},
  {q:"What is LLaMA, and what size range does the family span?",a:"LLaMA is a collection of open foundation language models ranging from 7B to 65B parameters, trained exclusively on publicly available data.",source:"Paper 2: LLaMA",tags:["LLaMA","foundation model"]},
  {q:"How did LLaMA-13B compare to GPT-3 (175B) on benchmarks?",a:"LLaMA-13B outperformed GPT-3 on most benchmarks despite having roughly 13× fewer parameters — demonstrating that data quality and quantity can compensate for model size.",source:"Paper 2: LLaMA",tags:["LLaMA","benchmarks"]},
  {q:"What public datasets did LLaMA use for training?",a:"CommonCrawl, C4, GitHub, Wikipedia, Books (Project Gutenberg & Books3), ArXiv papers, and Stack Exchange — totalling trillions of tokens, none proprietary.",source:"Paper 2: LLaMA",tags:["LLaMA","data"]},
  {q:"What is the key architectural difference between LLaMA and the original Transformer regarding normalisation?",a:"LLaMA uses pre-normalisation (RMSNorm applied before each sub-layer) instead of post-normalisation, which improves training stability.",source:"Paper 2: LLaMA",tags:["LLaMA","normalisation"]},
  {q:"What activation function does LLaMA use in its feed-forward layers, and why is it different?",a:"LLaMA replaces ReLU with SwiGLU (a variant of the Swish gated linear unit), which empirically improves performance on language modelling tasks.",source:"Paper 2: LLaMA",tags:["LLaMA","activation"]},
  {q:"What positional embedding scheme does LLaMA use instead of learned absolute positions?",a:"Rotary Positional Embeddings (RoPE), which encode relative positional information directly into the query and key vectors of the attention mechanism.",source:"Paper 2: LLaMA",tags:["LLaMA","positional encoding"]},
  {q:"What was the stated motivation for releasing LLaMA publicly to researchers?",a:"To enable reproducible research and democratise access to large language models, since prior state-of-the-art models like GPT-3 and PaLM were closed or inaccessible.",source:"Paper 2: LLaMA",tags:["LLaMA","open-source"]},
  {q:"How does LLaMA-65B compare to Chinchilla-70B and PaLM-540B?",a:"LLaMA-65B is competitive with both — matching Chinchilla-70B and approaching PaLM-540B on most benchmarks — despite being trained only on public data.",source:"Paper 2: LLaMA",tags:["LLaMA","benchmarks"]},
  {q:"What is RMSNorm and how does it differ from standard Layer Normalisation?",a:"RMSNorm normalises activations using only the root mean square of the inputs, without computing the mean (i.e., no re-centering). It is simpler and slightly faster than LayerNorm.",source:"Paper 2: LLaMA",tags:["LLaMA","normalisation"]},
  {q:"What is the Chinchilla scaling law insight that influenced LLaMA's training recipe?",a:"Hoffmann et al. (Chinchilla) showed that given a compute budget, the optimal approach is to train a smaller model on more tokens, rather than a larger model on fewer tokens. LLaMA followed this principle.",source:"Paper 2: LLaMA",tags:["LLaMA","scaling laws"]}
];

let idx=0, known=0, review=0, isFlipped=false;

function render(){
  const c=cards[idx];
  document.getElementById('question').textContent=c.q;
  document.getElementById('answer').textContent=c.a;
  document.getElementById('source-badge').textContent=c.source.split(':')[0];
  document.getElementById('counter').textContent=`Card ${idx+1} of ${cards.length}`;
  const pct=Math.round((idx/cards.length)*100);
  document.getElementById('progress').style.width=pct+'%';
  const tf=document.getElementById('tags-front');
  tf.innerHTML=c.tags.map(t=>`<span class="tag">${t}</span>`).join('');
  document.getElementById('s-know').textContent=known;
  document.getElementById('s-review').textContent=review;
}

function flipCard(){
  const fc=document.getElementById('flashcard');
  isFlipped=!isFlipped;
  fc.classList.toggle('flipped',isFlipped);
}

function markCard(didKnow){
  if(didKnow) known++; else review++;
  if(isFlipped){flipCard();}
  setTimeout(()=>{
    idx++;
    if(idx>=cards.length){
      document.getElementById('flashcard').style.display='none';
      document.querySelector('.btn-flip').style.display='none';
      document.querySelector('.btn-row').style.display='none';
      document.querySelector('.card-meta').style.display='none';
      document.getElementById('progress').style.width='100%';
      document.getElementById('s-know').textContent=known;
      document.getElementById('s-review').textContent=review;
      document.getElementById('complete-msg').textContent=`You knew ${known} of ${cards.length} cards. ${known>=15?'Excellent work!':known>=10?'Good progress!':'Keep practising!'}`;
      document.getElementById('complete-screen').style.display='block';
    } else {
      render();
    }
  },280);
}

function restart(){
  idx=0; known=0; review=0; isFlipped=false;
  document.getElementById('flashcard').style.display='block';
  document.getElementById('flashcard').classList.remove('flipped');
  document.querySelector('.btn-flip').style.display='block';
  document.querySelector('.btn-row').style.display='flex';
  document.querySelector('.card-meta').style.display='flex';
  document.getElementById('complete-screen').style.display='none';
  render();
}

render();
</script>
